            const pin = document.getElementById('pinInput').value;
            if (pin.length !== 4) {
                showError('PIN must be exactly 4 digits.');
                return;
            }

            try {
                const salt = CryptoJS.enc.Base64.parse(saltData);
                const iv = CryptoJS.enc.Base64.parse(ivData);

            }
